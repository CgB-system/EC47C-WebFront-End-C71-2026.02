<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Curupira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/cadastro.css">
</head>
<body>

  <main class="layout-autenticacao">

    <section class="secao-formulario">
      <div class="caixa-formulario">
        <p class="sobrescrito"><span class="traco"></span>NOVO POR AQUI?</p>
        <h2 class="titulo-principal">Crie sua<br><em>conta</em></h2>
        <p class="descricao">Preencha seus dados para começar a participar</p>

        <form action="login.html" method="get" class="formulario">
          <div class="grupo-campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" required minlength="2">
          </div>

          <div class="grupo-campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>

          <div class="grupo-campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
          </div>

          <div class="grupo-campo">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita sua senha" autocomplete="new-password" required minlength="6">
          </div>

          <div class="grupo-campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel">
          </div>

          <div class="grupo-campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" autocomplete="address-level2">
          </div>

          <button type="submit" class="botao-envio">Criar minha conta</button>
        </form>

        <p class="texto-alternar">Já tem uma conta? <a href="login.html">Faça login</a></p>
      </div>
    </section>

    <section class="secao-arte">
      <div class="conteudo-arte">
        <p class="sobrescrito claro"><span class="traco"></span>FAÇA PARTE</p>
        <h1 class="titulo-arte">Uma comunidade<br>que faz a natureza<br><em>florescer</em></h1>
        <p class="texto-arte">Crie sua conta e participe de ações locais pela vida terrestre</p>
      </div>
    </section>

  </main>

</body>
</html>
