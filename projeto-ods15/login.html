<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section>
            <h1>NomeOng</h1>
            <h2>Bem-vindo de volta!!!</h2>

            <form action="index.html" method="get">
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="senha">Senha</label><br>
                    <input type="password" id="senha" name="senha" required>
                </p>
                <p>
                    <input type="checkbox" id="lembrar" name="lembrar">
                    <label for="lembrar">Lembrar</label>
                    <a href="#">Esqueceu a senha?</a>
                </p>
                <p>
                    <input type="submit" value="Login">
                </p>
            </form>

            <p>
                Sem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </section>

        <section>
            <img src="assets/arquivo.png" alt="Imagem ilustrativa" width="400" height="400">
        </section>
    </main>
</body>
</html>
