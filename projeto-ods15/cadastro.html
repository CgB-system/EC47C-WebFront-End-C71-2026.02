<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section>
            <h1>Nome da ONG</h1>

            <form action="login.html" method="get">
                <p>
                    <label for="nome">Nome</label><br>
                    <input type="text" id="nome" name="nome" required>
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="senha">Senha</label><br>
                    <input type="password" id="senha" name="senha" required>
                </p>
                <p>
                    <label for="confirmarSenha">Confirmar Senha</label><br>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" required>
                </p>
                <p>
                    <label for="telefone">Telefone</label><br>
                    <input type="tel" id="telefone" name="telefone">
                </p>
                <p>
                    <label for="cidade">Cidade</label><br>
                    <input type="text" id="cidade" name="cidade">
                </p>
                <p>
                    <input type="submit" value="Criar conta">
                </p>
            </form>

            <p>
                Já tem uma conta? <a href="login.html">Faça login</a>
            </p>
        </section>

        <section>
            <img src="assets/arquivo.png" alt="Imagem ilustrativa" width="400" height="400">
        </section>
    </main>
</body>
</html>
